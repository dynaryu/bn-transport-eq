[pytest]
# Every asset keeps its tests in <asset>/tests/, and the natural filename there is
# test_model.py. With the default import mode pytest derives module names from the
# path and two assets both holding tests/test_model.py collide on collection, which
# breaks the whole run rather than one asset. importlib mode names them uniquely, so
# assets stay independent and no asset has to invent a filename to avoid its
# neighbours.
addopts = --import-mode=importlib
testpaths = assets src
