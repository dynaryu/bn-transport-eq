name: dra
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy
  - scipy
  - pytest
  - pip
  - pip:
      # Validates every file under schema/ and instances/ against schema/meta/.
      - jsonschema>=4.0
      # Optional: only the Anthropic backend of the language layer needs this.
      # Without it (or without a credential) everything else runs unchanged.
      - anthropic>=1.0
